.badge.selected{background:#dcfce7;color:#166534}
.badge.na{background:#f1f0ec;color:#666}
.vendors{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}

.vc b{color:#1a1a1a}
.spec-grid{display:grid;gap:7px;margin-top:8px}
.sf{display:flex;flex-direction:column;gap:3px}
.sf label{font-size:10px;color:#777;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sf input,.sf select,.sf textarea{font-size:12px;padding:5px 8px;border:1px solid #d0ced8;border-radius:5px;background:#f9f8f5;color:#1a1a1a;width:100%;font-family:inherit}
.sf textarea{resize:vertical;min-height:50px}
.sf input:focus,.sf textarea:focus{outline:none;border-color:#999;background:#fff}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{font-size:11px;padding:5px 12px;border-radius:5px;border:1px solid #d0ced8;background:#fff;cursor:pointer;color:#1a1a1a;transition:all .15s}
.btn:hover{background:#f1f0ec}
.btn.pri{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn.pri:hover{background:#333}
.footer{margin-top:2rem;padding:1.25rem 0;border-top:1px solid #e0ded8;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}

const ST={};
D.forEach(s=>s.items.forEach(i=>{ST[i.id]={status:"pending",fields:{}}}));

function total(){return D.reduce((a,s)=>a+s.items.length,0)}
function done(){return Object.values(ST).filter(v=>v.status==="selected").length}
function prog(){
  const p=Math.round(done()/total()*100);
  document.getElementById("pfill").style.width=p+"%";
  document.getElementById("ppct").textContent=p+"%";
  document.querySelectorAll("[data-tdot]").forEach(el=>{
    const sec=D.find(s=>s.id===el.dataset.tdot);
    el.classList.toggle("done",sec&&sec.items.every(i=>ST[i.id].status==="selected"));
  });
}
function setS(id,st){
  ST[id].status=st;
  const card=document.querySelector(`[data-card="${id}"]`);
  const b=card.querySelector(".badge");
  b.textContent=st==="selected"?"Selected":st==="na"?"N/A":"Pending";
  b.className="badge "+st;
  card.classList.toggle("sel",st==="selected");
  prog();
}
function build(){
  const nav=document.getElementById("tabs");
  const wrap=document.getElementById("panels");
  D.forEach((sec,si)=>{
    const btn=document.createElement("button");
    btn.className="tab"+(si===0?" active":"");
    btn.innerHTML=`<span class="tdot" data-tdot="${sec.id}"></span>${sec.label}`;
    btn.onclick=()=>{
      document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("p-"+sec.id).classList.add("active");
    };
    nav.appendChild(btn);
    const pnl=document.createElement("div");
    pnl.className="panel"+(si===0?" active":"");
    pnl.id="p-"+sec.id;
    const sh=document.createElement("div");
    sh.className="sec-head";sh.textContent=sec.label;
    pnl.appendChild(sh);
    sec.items.forEach(item=>{
      const card=document.createElement("div");
      card.className="card";card.dataset.card=item.id;
      const top=document.createElement("div");top.className="card-top";
      const nb=document.createElement("div");
      nb.innerHTML=`<div class="iname">${item.name}</div><div class="inote">${item.note}</div>`;
      const badge=document.createElement("span");badge.className="badge pending";badge.textContent="Pending";
      top.appendChild(nb);top.appendChild(badge);card.appendChild(top);
      const vd=document.createElement("div");vd.className="vendors";
      item.v.forEach(v=>{
        const c=document.createElement("div");c.className="vc";
        c.innerHTML=`<b>${v.n}</b>${v.d?" — "+v.d:""}`;vd.appendChild(c);
      });
      card.appendChild(vd);
      const cols=Math.min(item.s.length,4);
      const sg=document.createElement("div");sg.className="spec-grid";
      sg.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
      item.s.forEach(spec=>{
        const sf=document.createElement("div");sf.className="sf";
        const lbl=document.createElement("label");lbl.textContent=spec;
        const isN=spec.toLowerCase().includes("note");
        let inp;
        if(isN){inp=document.createElement("textarea");}
        else{inp=document.createElement("input");inp.type="text";}
        inp.placeholder=isN?"Notes...":"";
        inp.addEventListener("input",()=>{ST[item.id].fields[spec]=inp.value});
        sf.appendChild(lbl);sf.appendChild(inp);sg.appendChild(sf);
      });
      card.appendChild(sg);
      const acts=document.createElement("div");acts.className="actions";
      [["Mark selected","sel","pri"],["Reset to pending","pending",""],["Not applicable","na",""]].forEach(([lbl,st,cls])=>{
        const b=document.createElement("button");b.className="btn"+(cls?" "+cls:"");b.textContent=lbl;
        b.onclick=()=>setS(item.id,st==="sel"?"selected":st);
        acts.appendChild(b);
      });
      card.appendChild(acts);pnl.appendChild(card);
    });
    wrap.appendChild(pnl);
  });
}
function doExport(){
  const client=document.getElementById("f-client").value||"Dillenburg";
  const date=document.getElementById("f-date").value||"—";
  const stage=document.getElementById("f-stage").value||"—";
  let out=`MILLHOUSE CUSTOM HOMES — MATERIAL SELECTIONS\n`;
  out+=`PROJECT: Dillenburg Residence | Permit PER25-08870 | Pinal County AZ\n`;
  out+=`CLIENT: ${client} | DATE: ${date} | STAGE: ${stage}\n`;
  out+=`COMPLETION: ${done()} of ${total()} items selected\n`;
  out+="=".repeat(60)+"\n\n";
  D.forEach(sec=>{
    out+=sec.label.toUpperCase()+"\n"+"—".repeat(40)+"\n";
    sec.items.forEach(item=>{
      const s=ST[item.id];
      out+=`\n  ${item.name}\n  Status: ${s.status.toUpperCase()}\n`;
      item.s.forEach(sp=>{out+=`  ${sp}: ${s.fields[sp]||"—"}\n`});
    });
    out+="\n";
  });
  const el=document.getElementById("export-out");
  el.style.display="block";el.textContent=out;
  el.scrollIntoView({behavior:"smooth"});
}
build();prog();
</script>
